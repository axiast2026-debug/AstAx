# Phase 8: secrets in the history. The repository is public: no real secret may
# ever be committed (CLAUDE.md, rule 12). The allowlist covers only the
# placeholders and the synthetic test keys, which are not secrets.
title = "AstAx"

[extend]
useDefault = true

[allowlist]
description = "Placeholders and synthetic keys of the tests"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)test/int/''',
  '''(^|/)tests/e2e/(specs|support)/''',
  '''\.test\.ts$''',
  '''(^|/)demo-documenti/''',
]
regexes = [
  '''__GENERATE__''',
  '''test-secret-not-used''',
  # The Terraform task definitions name the Secrets Manager entries that hold the
  # passwords (KC_DB_PASSWORD = "KEYCLOAK_DB_PASSWORD"): names, not values.
  '''"?KEYCLOAK_DB_PASSWORD"?''',
]
