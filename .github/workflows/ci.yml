# AstAx continuous integration (fase 1, passo 13). Required for merging into main:
# set it in GitHub, Settings → Branches → branch protection for main → require
# status checks «check» and «e2e».
# On a push to main the demo images start as soon as «check» is green; the
# browser tests run in 4 parts at the same time (Dan, 2026-10-29).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm is enabled by corepack in the next step: no automatic cache here.
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Local secrets for the test environment
        run: pnpm env:init
      # Lint, types, unit tests and integration tests (Testcontainers uses the runner's Docker).
      - name: pnpm check
        run: pnpm check
      - name: Build
        run: pnpm build

  # Phase 8 (OWASP ASVS V14.2, V1.14): code, libraries and secrets.
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: a secret removed later is still in an old commit.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Known vulnerabilities in the libraries (high and critical)
        run: pnpm audit --prod --audit-level high
      - name: Semgrep (security rules for TypeScript, Node.js, secrets, plus .semgrep.yml)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep:1.179.0
          semgrep scan --error --metrics=off
          --config p/typescript --config p/nodejs --config p/secrets --config .semgrep.yml
      - name: Secrets in the history (Gitleaks)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  # Phase 8: the AWS infrastructure (infra/terraform), checked without any account:
  # format, validation and the security tests with a simulated AWS.
  infra:
    name: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Terraform format, validate, test
        run: |
          tf() { docker run --rm -v "$PWD/infra/terraform:/tf" -w "/tf/$1" hashicorp/terraform:1.16.4 "${@:2}"; }
          tf . fmt -check -recursive
          for dir in modules/astax envs/collaudo envs/produzione bootstrap; do
            tf "$dir" init -backend=false -input=false
            tf "$dir" validate
          done
          tf modules/astax test

  demo:
    name: demo images
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/demo.yml

  e2e-part:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: check
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm is enabled by corepack in the next step: no automatic cache here.
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Local secrets for the test environment
        run: pnpm env:init
      - name: Start PostgreSQL, Redis, Keycloak, Temporal, storage, Mailpit
        run: pnpm infra:up
      - name: Database, synthetic data and Keycloak users
        run: |
          pnpm build
          pnpm db:migrate
          pnpm db:seed
          pnpm keycloak:sync
      - name: Install Chromium for Playwright
        run: pnpm --filter @astax/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @astax/e2e exec playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: "true"
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
      - name: Service logs
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --tail=200 keycloak

  # The required status check «e2e»: green only when the 4 parts are.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    needs: e2e-part
    if: always()
    steps:
      - run: test "${{ needs.e2e-part.result }}" = "success"
