# AstAx continuous integration (fase 1, passo 13). Required for merging into main:
# set it in GitHub, Settings → Branches → branch protection for main → require
# status checks «check» and «e2e».
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Local secrets for the test environment
        run: pnpm env:init
      # Lint, types, unit tests and integration tests (Testcontainers uses the runner's Docker).
      - name: pnpm check
        run: pnpm check
      - name: Build
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Local secrets for the test environment
        run: pnpm env:init
      - name: Start PostgreSQL, Redis, Keycloak, Temporal, storage, Mailpit
        run: pnpm infra:up
      - name: Database, synthetic data and Keycloak users
        run: |
          pnpm build
          pnpm db:migrate
          pnpm db:seed
          pnpm keycloak:sync
      - name: Install Chromium for Playwright
        run: pnpm --filter @astax/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: "true"
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
      - name: Service logs
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --tail=200 keycloak
