# Testi delle notifiche di AstAx.
# Regole, destinatari e canali: docs/notifiche.md.
# Campi: title e body valgono per in app e push; emailSubject ed emailBody per l'email; sms per l'SMS.
# Variabili tra doppie graffe, già formattate dal motore (importi, date nel fuso di Roma, etichette nella lingua del destinatario).
# Le versioni in albanese (sq) servono al back office: vanno rilette da un madrelingua prima del lancio.

schemaVersion: 1

# Etichette che il motore mette nelle variabili, nella lingua del destinatario.
labels:
  offerStatus.valid: { it: "valida", sq: "e vlefshme" }
  offerStatus.excluded: { it: "esclusa", sq: "e përjashtuar" }
  offerExclusion.generic:
    it: "Le coperture o i dati dichiarati non rispettano la richiesta."
    sq: "Mbulimet ose të dhënat e deklaruara nuk përputhen me kërkesën."
  offerExclusion.none: { it: "", sq: "" }
  guarantee.none: { it: "—", sq: "—" }
  offerQuote.fileName: { it: "preventivo.pdf", sq: "oferta.pdf" }
  renewal.autoDraftReady:
    it: "Rinnovo automatico attivo: la bozza è pronta, manca solo il nuovo attestato."
    sq: "Rinovimi automatik aktiv: drafti është gati, mungon vetëm dëshmia e re."
  renewal.autoOff:
    it: "Puoi preparare il rinnovo con i dati già salvati."
    sq: "Mund ta përgatitësh rinovimin me të dhënat e ruajtura."
  invoice.brokerLine:
    it: "Fee AstAx sulle polizze acquistate fino al mese"
    sq: "Tarifa AstAx për policat e blera deri në muajin"

events:

  # ---------------------------------------------------------------- Accesso

  auth.otp:
    recipients: [user]
    channels: [sms, email]
    mandatory: true
    variables: [codice_otp, scopo, minuti]
    it:
      sms: "AstAx: {{codice_otp}} è il codice per {{scopo}}. Vale {{minuti}} minuti. Non condividerlo con nessuno."
      emailSubject: "Il tuo codice AstAx"
      emailBody: |
        Il codice per {{scopo}} è {{codice_otp}}.
        Vale {{minuti}} minuti. Se non l'hai chiesto tu, ignora questo messaggio: nessuno di AstAx ti chiederà mai questo codice.

  # ---------------------------------------------------------------- Richiesta e verifica

  request.submitted.bo:
    recipients: [bo_verifiers]
    channels: [in_app]
    variables: [codice, canale, veicolo, esito_auto, link]
    it:
      title: "Nuova richiesta da verificare"
      body: "{{codice}} · {{canale}} · {{veicolo}}. Controllo automatico: {{esito_auto}}."
    sq:
      title: "Kërkesë e re për verifikim"
      body: "{{codice}} · {{canale}} · {{veicolo}}. Kontrolli automatik: {{esito_auto}}."

  request.integration_requested:
    recipients: [requester]
    channels: [in_app, push, email]
    variables: [nome, codice, veicolo, motivo, messaggio_back_office, link]
    it:
      title: "Serve un'integrazione"
      body: "Per la richiesta {{codice}} manca ancora qualcosa: {{motivo}}."
      emailSubject: "Richiesta {{codice}}: serve un'integrazione"
      emailBody: |
        Ciao {{nome}},
        per mettere all'asta la richiesta {{codice}} ({{veicolo}}) ci serve ancora: {{motivo}}.
        {{messaggio_back_office}}
        Completa qui: {{link}}

  request.excluded:
    recipients: [requester]
    channels: [in_app, email]
    variables: [nome, codice, veicolo, motivo, messaggio_back_office]
    it:
      title: "Questa richiesta non può andare all'asta"
      body: "{{codice}}: {{motivo}}."
      emailSubject: "Richiesta {{codice}}: non può andare all'asta"
      emailBody: |
        Ciao {{nome}},
        la richiesta {{codice}} per {{veicolo}} non può andare all'asta: {{motivo}}.
        {{messaggio_back_office}}
        Non ti è stato addebitato nulla. Per domande scrivici dall'app.

  consent.signature_request:
    recipients: [broker_client]
    channels: [email, sms]
    mandatory: true
    variables: [nome, broker, veicolo, link, scadenza_link]
    it:
      sms: "{{broker}} ti chiede il consenso per un preventivo RC auto su AstAx: {{link}}"
      emailSubject: "{{broker}} ti chiede il consenso per il preventivo RC auto"
      emailBody: |
        Buongiorno {{nome}},
        {{broker}} sta chiedendo per te un preventivo RC auto su AstAx per {{veicolo}}.
        Per procedere serve il tuo consenso a condividere i dati del preventivo con le agenzie che faranno l'offerta. Telefono ed email non vengono condivisi.
        Leggi e conferma con un codice: {{link}}
        Il link vale fino al {{scadenza_link}}.

  # ---------------------------------------------------------------- Asta

  auction.opened.requester:
    recipients: [requester]
    channels: [in_app, push, email]
    variables: [nome, codice, veicolo, ora_chiusura, link]
    it:
      title: "Asta aperta"
      body: "{{veicolo}}: le agenzie stanno preparando le offerte. Chiusura {{ora_chiusura}}."
      emailSubject: "La tua asta è aperta: chiude {{ora_chiusura}}"
      emailBody: |
        Ciao {{nome}},
        abbiamo verificato la richiesta {{codice}} e l'asta è aperta.
        Chiusura: {{ora_chiusura}}.
        Durante l'asta vedi quante offerte arrivano; i prezzi compaiono alla chiusura.
        Segui l'asta: {{link}}

  auction.invited:
    recipients: [invited_agency_users]
    channels: [in_app, push, email]
    variables: [codice, veicolo, provincia, pacchetto, decorrenza, garanzia_minima, ora_chiusura, link]
    it:
      title: "Nuova richiesta in target"
      body: "{{veicolo}} · {{provincia}} · {{pacchetto}}. Chiude {{ora_chiusura}}."
      emailSubject: "Nuova richiesta {{codice}}: chiude {{ora_chiusura}}"
      emailBody: |
        È arrivata una richiesta nei vostri filtri.
        Veicolo: {{veicolo}}
        Provincia: {{provincia}}
        Pacchetto: {{pacchetto}}
        Decorrenza: {{decorrenza}}
        Prezzo da garantire almeno fino al: {{garanzia_minima}}
        Chiusura dell'asta: {{ora_chiusura}}
        Apri la richiesta: {{link}}
        Ogni apertura dei dati del cliente viene registrata.

  auction.closing_soon:
    recipients: [invited_agency_users_without_offer]
    channels: [in_app, push]
    forcePush: true
    variables: [codice, veicolo, ora_chiusura, link]
    it:
      title: "Asta in chiusura"
      body: "{{codice}} ({{veicolo}}) chiude {{ora_chiusura}} e non avete ancora offerto."

  auction.closed.requester:
    recipients: [requester]
    channels: [in_app, push, email]
    # Regola 8 di CLAUDE.md: nessun prezzo nelle notifiche (domanda aperta 15).
    variables: [nome, codice, veicolo, numero_offerte, link]
    it:
      title: "Le offerte sono pronte"
      body: "{{numero_offerte}} offerte per {{veicolo}}: aprile per confrontarle."
      emailSubject: "{{numero_offerte}} offerte per {{veicolo}}"
      emailBody: |
        Ciao {{nome}},
        l'asta della richiesta {{codice}} è chiusa.
        Offerte valide: {{numero_offerte}}.
        Ogni offerta è garantita fino alla data indicata accanto al prezzo. Confrontale e scegli: {{link}}

  auction.closed.agency:
    recipients: [participating_agency_users]
    channels: [in_app, email]
    variables: [codice, veicolo, stato_offerta, motivo_esclusione, garanzia_offerta, link]
    it:
      title: "Asta chiusa: {{codice}}"
      body: "La vostra offerta è {{stato_offerta}}. La classifica arriva quando il cliente sceglie."
      emailSubject: "Asta {{codice}} chiusa: offerta {{stato_offerta}}"
      emailBody: |
        L'asta {{codice}} ({{veicolo}}) si è chiusa.
        Stato della vostra offerta: {{stato_offerta}}. {{motivo_esclusione}}
        Se è valida, resta vincolante fino al {{garanzia_offerta}}.
        Le prime due offerte e la vostra posizione saranno visibili quando il cliente accetta un'offerta.
        Dettagli: {{link}}

  auction.reopened.requester:
    recipients: [requester]
    channels: [in_app, push]
    variables: [veicolo, ora_chiusura, link]
    it:
      title: "Abbiamo invitato altre agenzie"
      body: "Per {{veicolo}} non sono arrivate offerte valide: l'asta è riaperta fino a {{ora_chiusura}}."

  auction.deserted.requester:
    recipients: [requester]
    channels: [in_app, push, email]
    variables: [nome, codice, veicolo]
    it:
      title: "Nessuna offerta per ora"
      body: "Per {{veicolo}} non sono arrivate offerte valide. Ti scriviamo con le alternative."
      emailSubject: "Richiesta {{codice}}: nessuna offerta valida"
      emailBody: |
        Ciao {{nome}},
        per la richiesta {{codice}} ({{veicolo}}) nessuna agenzia ha presentato un'offerta valida, nemmeno dopo aver invitato altre agenzie.
        Il nostro back office valuta le alternative e ti scrive.
        Non ti è stato addebitato nulla.

  auction.deserted.bo:
    recipients: [bo_verifiers, bo_supervisors]
    channels: [in_app, email]
    variables: [codice, veicolo, link]
    it:
      title: "Asta deserta: {{codice}}"
      body: "Nessuna offerta valida anche dopo la riapertura. Decidi se aprire una nuova asta o avvisare il cliente."
      emailSubject: "Asta deserta: {{codice}}"
      emailBody: |
        La richiesta {{codice}} ({{veicolo}}) è deserta anche dopo la riapertura automatica.
        Decidi se aprire una nuova asta con filtri più ampi o chiudere con un avviso al cliente: {{link}}
    sq:
      title: "Ankand pa oferta: {{codice}}"
      body: "Asnjë ofertë e vlefshme edhe pas rihapjes. Vendos nëse do të hapësh një ankand të ri apo do të njoftosh klientin."
      emailSubject: "Ankand pa oferta: {{codice}}"
      emailBody: |
        Kërkesa {{codice}} ({{veicolo}}) mbeti pa oferta edhe pas rihapjes automatike.
        Vendos nëse do të hapësh një ankand të ri me filtra më të gjerë apo do ta mbyllësh me një njoftim për klientin: {{link}}

  offer.quote_mismatch.bo:
    recipients: [bo_verifiers, bo_supervisors]
    channels: [in_app, email]
    # OFF-09: ids and code only, never the premiums that differ (rule 8).
    variables: [codice, numero, link]
    it:
      title: "Preventivi da controllare: {{codice}}"
      body: "{{numero}} preventivi PDF non corrispondono all'offerta dichiarata."
      emailSubject: "Preventivi da controllare: {{codice}}"
      emailBody: |
        Alla chiusura della richiesta {{codice}}, {{numero}} preventivi PDF non corrispondono all'offerta dichiarata.
        Controllali e decidi se escludere l'offerta, finché il cliente non ha accettato: {{link}}
    sq:
      title: "Oferta për t'u kontrolluar: {{codice}}"
      body: "{{numero}} oferta PDF nuk përputhen me ofertën e deklaruar."
      emailSubject: "Oferta për t'u kontrolluar: {{codice}}"
      emailBody: |
        Në mbylljen e kërkesës {{codice}}, {{numero}} oferta PDF nuk përputhen me ofertën e deklaruar.
        Kontrolloji dhe vendos nëse e përjashton ofertën, para se klienti ta pranojë: {{link}}

  offer.excluded_after_review:
    recipients: [participating_agency_users]
    channels: [in_app, email]
    # Regola 8 di CLAUDE.md: il motivo, testo libero, si legge in «Le mie offerte».
    variables: [codice, link]
    it:
      title: "Offerta esclusa: {{codice}}"
      body: "Il back office ha escluso la vostra offerta dopo il controllo del preventivo PDF. Il motivo è in «Le mie offerte»."
      emailSubject: "Offerta esclusa: {{codice}}"
      emailBody: |
        Dopo il controllo del preventivo PDF, il back office ha escluso la vostra offerta per la richiesta {{codice}}.
        Il motivo è nella pagina «Le mie offerte».
        Per chiarimenti scrivete all'assistenza dalla pagina della richiesta: {{link}}

  # ---------------------------------------------------------------- Garanzia e riconferma

  guarantee.expiring:
    recipients: [requester]
    channels: [in_app, push, email]
    forcePush: true
    # Regola 8 di CLAUDE.md: nessun prezzo nelle notifiche (domanda aperta 15).
    variables: [nome, veicolo, garanzia, giorni, link]
    it:
      title: "Il prezzo migliore scade tra {{giorni}} giorni"
      body: "L'offerta più conveniente per {{veicolo}} è garantita fino al {{garanzia}}."
      emailSubject: "La tua offerta migliore è garantita fino al {{garanzia}}"
      emailBody: |
        Ciao {{nome}},
        l'offerta più conveniente per {{veicolo}} è garantita fino al {{garanzia}}.
        Se vuoi acquistare a questo prezzo, accetta entro quella data: {{link}}

  request.expired:
    recipients: [requester]
    channels: [in_app, push, email]
    variables: [nome, veicolo, link]
    it:
      title: "Le offerte sono scadute"
      body: "Puoi chiedere alle stesse agenzie di riconfermare il prezzo con un clic."
      emailSubject: "Le offerte per {{veicolo}} sono scadute"
      emailBody: |
        Ciao {{nome}},
        le garanzie delle offerte per {{veicolo}} sono scadute.
        Puoi chiedere alle stesse agenzie di confermare o aggiornare il prezzo, senza rifare la richiesta: {{link}}

  reconfirmation.requested:
    recipients: [agencies_with_valid_offer]
    channels: [in_app, push, email]
    forcePush: true
    # Regola 8 di CLAUDE.md: nessun prezzo nelle notifiche (domanda aperta 15).
    variables: [codice, veicolo, termine, link]
    it:
      title: "Richiesta di riconferma: {{codice}}"
      body: "Il cliente chiede di riconfermare il prezzo. Rispondete entro {{termine}}."
      emailSubject: "Riconferma entro {{termine}}: {{codice}}"
      emailBody: |
        Il richiedente della pratica {{codice}} ({{veicolo}}) chiede di riconfermare la vostra offerta.
        Potete confermare il prezzo, aggiornarlo o rinunciare entro {{termine}}. Le risposte restano in busta chiusa fino alla scadenza.
        Rispondi: {{link}}

  reconfirmation.completed.requester:
    recipients: [requester]
    channels: [in_app, push, email]
    # Regola 8 di CLAUDE.md: nessun prezzo nelle notifiche (domanda aperta 15).
    variables: [nome, veicolo, numero_offerte, link]
    it:
      title: "Prezzi riconfermati"
      body: "{{numero_offerte}} offerte valide per {{veicolo}}, con nuove date di garanzia."
      emailSubject: "Prezzi riconfermati per {{veicolo}}"
      emailBody: |
        Ciao {{nome}},
        le agenzie hanno risposto: {{numero_offerte}} offerte valide, con nuove date di garanzia.
        Confrontale e scegli: {{link}}

  request.auto_cancelled:
    recipients: [requester]
    channels: [in_app, email]
    variables: [nome, veicolo, giorni, link]
    it:
      title: "Richiesta chiusa"
      body: "Dopo {{giorni}} giorni senza riconferma la richiesta per {{veicolo}} si è chiusa."
      emailSubject: "La richiesta per {{veicolo}} si è chiusa"
      emailBody: |
        Ciao {{nome}},
        le offerte per {{veicolo}} erano scadute e in {{giorni}} giorni non è stata chiesta una riconferma: la richiesta si è chiusa da sola.
        Quando vuoi, puoi fare una nuova richiesta: {{link}}

  # ---------------------------------------------------------------- Accettazione e pagamento

  offer.link_to_client:
    recipients: [broker_client]
    channels: [email, sms]
    mandatory: true
    # Regola 8 di CLAUDE.md: nessun prezzo nelle notifiche (domanda aperta 15, proposta G della fase 5).
    variables: [nome, broker, veicolo, descrizione_offerta, garanzia, link, scadenza_link]
    it:
      sms: "{{broker}} ti ha inviato l'offerta RC auto per {{veicolo}}: {{link}}"
      emailSubject: "{{broker}}: la tua offerta RC auto per {{veicolo}}"
      emailBody: |
        Buongiorno {{nome}},
        {{broker}} ti propone {{descrizione_offerta}} per {{veicolo}}.
        Il prezzo è garantito fino al {{garanzia}}: lo trovi nel link.
        Da questo link leggi i documenti, firmi con un codice e paghi: {{link}}
        Il link vale fino al {{scadenza_link}}.

  payment.confirmed:
    recipients: [payer]
    channels: [in_app, email]
    # Regola 8 di CLAUDE.md: nessun prezzo nelle notifiche (domanda aperta 15, proposta G della fase 5).
    variables: [nome, veicolo, agenzia, termine_emissione, link]
    it:
      title: "Pagamento ricevuto"
      body: "Abbiamo ricevuto il pagamento. La polizza sarà emessa entro {{termine_emissione}}."
      emailSubject: "Pagamento ricevuto per {{veicolo}}"
      emailBody: |
        Ciao {{nome}},
        abbiamo ricevuto il pagamento per {{veicolo}}; il riepilogo con gli importi è nella pagina della richiesta.
        L'agenzia {{agenzia}} emetterà la polizza entro {{termine_emissione}}. Ti avvisiamo appena i documenti sono pronti.
        Riepilogo: {{link}}

  payment.failed:
    recipients: [payer]
    channels: [in_app, push, email]
    variables: [nome, veicolo, garanzia, link]
    it:
      title: "Pagamento non riuscito"
      body: "Il pagamento per {{veicolo}} non è andato a buon fine. Puoi riprovare fino al {{garanzia}}."
      emailSubject: "Pagamento non riuscito per {{veicolo}}"
      emailBody: |
        Ciao {{nome}},
        il pagamento per {{veicolo}} non è andato a buon fine e non ti è stato addebitato nulla.
        L'offerta resta garantita fino al {{garanzia}}: puoi riprovare o scegliere un'altra offerta da qui: {{link}}

  offer.won:
    recipients: [winning_agency_users]
    channels: [in_app, push, email]
    forcePush: true
    # Regola 8 di CLAUDE.md: nessun prezzo nelle notifiche (domanda aperta 15, proposta G della fase 5).
    variables: [codice, veicolo, compagnia, termine_emissione, decorrenza, link]
    it:
      title: "Avete vinto: {{codice}}"
      body: "Pagamento confermato. Emettete entro {{termine_emissione}}."
      emailSubject: "Polizza da emettere entro {{termine_emissione}}: {{codice}}"
      emailBody: |
        Il cliente ha accettato e pagato la vostra offerta ({{compagnia}}) per {{veicolo}}.
        Termine di emissione: {{termine_emissione}}, comunque prima della decorrenza del {{decorrenza}}.
        Nell'area «Da emettere» trovate i dati completi, i contatti del cliente, i documenti firmati e la ricevuta di pagamento: {{link}}

  offer.won.bo:
    recipients: [bo_verifiers]
    channels: [in_app]
    variables: [codice, agenzia, termine_emissione, link]
    it:
      title: "Polizza da emettere: {{codice}}"
      body: "Pagamento confermato. {{agenzia}} deve emettere entro {{termine_emissione}}."
    sq:
      title: "Policë për t'u lëshuar: {{codice}}"
      body: "Pagesa u konfirmua. {{agenzia}} duhet ta lëshojë deri më {{termine_emissione}}."

  ranking.available:
    recipients: [participating_agency_users]
    channels: [in_app, email]
    # Regola 8 di CLAUDE.md: nessun prezzo nelle notifiche (domanda aperta 15, proposta G della fase 5).
    variables: [codice, posizione, totale_offerte, link]
    it:
      title: "Classifica disponibile: {{codice}}"
      body: "La vostra offerta è {{posizione}}ª su {{totale_offerte}}."
      emailSubject: "Classifica della richiesta {{codice}}"
      emailBody: |
        La classifica della richiesta {{codice}} è disponibile: la vostra offerta è {{posizione}}ª su {{totale_offerte}}.
        Le offerte degli altri sono anonime. I premi e lo scarto dalla prima sono nella pagina dei risultati: {{link}}

  ranking.available.excluded:
    recipients: [participating_agency_users]
    channels: [in_app]
    # Regola 8: il motivo, testo libero, si legge nell'app.
    variables: [codice, link]
    it:
      title: "Classifica disponibile: {{codice}}"
      body: "La vostra offerta era esclusa: il motivo è in «Le mie offerte»."

  # ---------------------------------------------------------------- Emissione

  issuance.deadline_near:
    recipients: [winning_agency_users]
    channels: [in_app, push, email]
    forcePush: true
    variables: [codice, minuti, termine_emissione, link]
    it:
      title: "Emissione in scadenza: {{codice}}"
      body: "Mancano {{minuti}} minuti al termine di emissione ({{termine_emissione}})."
      emailSubject: "Emissione entro {{termine_emissione}}: {{codice}}"
      emailBody: |
        La polizza della richiesta {{codice}} va emessa entro {{termine_emissione}}.
        Caricate polizza, quietanza e certificato, oppure segnalate subito un problema: {{link}}

  issuance.deadline_near.bo:
    recipients: [bo_verifiers]
    channels: [in_app]
    variables: [codice, agenzia, termine_emissione, link]
    it:
      title: "Termine di emissione vicino: {{codice}}"
      body: "{{agenzia}} non ha ancora emesso. Termine: {{termine_emissione}}."
    sq:
      title: "Afati i lëshimit po afron: {{codice}}"
      body: "{{agenzia}} nuk e ka lëshuar ende policën. Afati: {{termine_emissione}}."

  issuance.deadline_passed:
    recipients: [winning_agency_users]
    channels: [in_app, push, email]
    forcePush: true
    variables: [codice, decorrenza, link]
    it:
      title: "Termine di emissione superato: {{codice}}"
      body: "Emettete subito: la decorrenza è il {{decorrenza}}. È stata proposta la penale per ritardo."
      emailSubject: "Termine superato: {{codice}}"
      emailBody: |
        Il termine di emissione della richiesta {{codice}} è scaduto ed è stata proposta la penale per ritardo.
        Emettete subito: la decorrenza è il {{decorrenza}}. Se non potete emettere, segnalatelo dall'area «Da emettere»: {{link}}

  issuance.deadline_passed.bo:
    recipients: [bo_verifiers, bo_supervisors]
    channels: [in_app, email]
    variables: [codice, agenzia, termine_emissione, decorrenza, link]
    it:
      title: "Termine di emissione superato: {{codice}}"
      body: "{{agenzia}} non ha emesso entro {{termine_emissione}}. Decorrenza: {{decorrenza}}."
      emailSubject: "Termine di emissione superato: {{codice}}"
      emailBody: |
        {{agenzia}} non ha emesso la polizza della richiesta {{codice}} entro {{termine_emissione}}. È stata proposta la penale per ritardo.
        Decorrenza: {{decorrenza}}. Se la polizza non arriva in tempo, apri la mancata emissione: {{link}}
    sq:
      title: "Afati i lëshimit ka kaluar: {{codice}}"
      body: "{{agenzia}} nuk e lëshoi policën brenda {{termine_emissione}}. Data e fillimit: {{decorrenza}}."
      emailSubject: "Afati i lëshimit ka kaluar: {{codice}}"
      emailBody: |
        {{agenzia}} nuk e lëshoi policën e kërkesës {{codice}} brenda {{termine_emissione}}. U propozua gjoba për vonesë.
        Data e fillimit: {{decorrenza}}. Nëse polica nuk lëshohet në kohë, hap rastin e moslëshimit: {{link}}

  issuance.missed.bo:
    recipients: [bo_verifiers, bo_supervisors]
    channels: [in_app, email]
    variables: [codice, agenzia, decorrenza, link]
    it:
      title: "Mancata emissione: {{codice}}"
      body: "{{agenzia}} non ha emesso prima della decorrenza ({{decorrenza}}). Decidi di chi è la colpa."
